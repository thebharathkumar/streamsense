[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsense-har"
version = "0.1.0"
description = "Multimodal human activity recognition on PAMAP2 with ONNX deployment and FastAPI inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "streamsense" }]
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2,<2.6",
    "pytorch-lightning>=2.2",
    "tensorboard>=2.15",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
]

[project.scripts]
streamsense-train = "streamsense.train.cli:main"
streamsense-evaluate = "streamsense.eval.cli:main"
streamsense-export = "streamsense.export.cli:main"
streamsense-benchmark = "streamsense.export.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gpu: requires CUDA",
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
